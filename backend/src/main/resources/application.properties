spring.application.name=hcg-multiservicios

# Render (y otros hosts) indican el puerto en la variable PORT.
server.port=${PORT:8080}

# Lee el archivo .env (en la raiz del repo o en backend/) sin tener que definir variables a mano.
# Si no existe, se ignora (las variables de entorno del sistema siguen funcionando).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# --- Base de datos Supabase ---
spring.datasource.url=${DB_URL:jdbc:postgresql://db.etfgzmchqmnixwaxokhe.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate NUNCA modifica el esquema: solo valida que coincida con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway gestiona el esquema con migraciones aditivas.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false

# --- Seguridad ---
# Secreto HS256 (minimo 32 caracteres). Obligatorio: la app no arranca sin el.
hcg.security.jwt.secret=${HCG_JWT_SECRET:}
hcg.security.jwt.expiration-minutes=${HCG_JWT_EXPIRATION_MINUTES:480}
hcg.security.login.max-attempts=5
hcg.security.login.lock-minutes=15
hcg.cors.allowed-origins=${HCG_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Primer administrador: solo se crea si la tabla usuario esta vacia y ambas variables existen.
hcg.bootstrap.admin.username=${HCG_ADMIN_USERNAME:}
hcg.bootstrap.admin.email=${HCG_ADMIN_EMAIL:}
hcg.bootstrap.admin.password=${HCG_ADMIN_PASSWORD:}

# --- Errores: nunca exponer detalles internos ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- APIsPERU Facturacion Electronica ---
apisperu.url=${APISPERU_URL:https://facturacion.apisperu.com/api/v1/invoice/send}
apisperu.token=${APISPERU_TOKEN:}
apisperu.company.ruc=${APISPERU_COMPANY_RUC:20026788123}
apisperu.company.razon-social=${APISPERU_COMPANY_RAZON_SOCIAL:MULTISERVICIOS HCG E.I.R.L.}
apisperu.company.direccion=${APISPERU_COMPANY_DIRECCION:AV. PUENTE PIEDRA 123}
apisperu.company.ubigeo=${APISPERU_COMPANY_UBIGEO:150101}

